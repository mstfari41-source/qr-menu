<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Ana Sayfa | İşletme Paneli</title>
  </head>
  <body
    x-data="{ page: 'ecommerce', 'loaded': true, 'darkMode': false, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode')) ?? false;
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/common/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/layout/app-layout/sidebar/index.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-1 flex-col overflow-x-hidden overflow-y-auto"
      >
        <!-- ===== Main Content Start ===== -->
        <main id="main-content">
          <!-- ===== Header Start ===== -->
          <include src="./partials/layout/app-layout/header/index.html" />
          <!-- ===== Header End ===== -->
          <div
            class="mx-auto max-w-(--breakpoint-2xl) p-4 pb-20 md:p-6 md:pb-6"
          >
            <div class="space-y-4 md:space-y-6">
              <!-- Page Title Start -->
              <div class="flex flex-wrap items-center justify-between gap-3">
                <h2 class="text-xl font-semibold text-gray-800 dark:text-white/90">Ana Sayfa</h2>
                <a
                  :href="$store.menu.url + '?masa=1'"
                  target="_blank"
                  rel="noopener"
                  class="inline-flex h-11 items-center gap-2 rounded-lg bg-brand-500 px-4 text-sm font-medium text-white shadow-theme-xs hover:bg-brand-600"
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></svg>
                  Menüyü görüntüle
                </a>
              </div>
              <!-- Page Title End -->

              <!-- Picks Start -->
              <div class="grid grid-cols-1 gap-4 md:grid-cols-2 md:gap-6 2xl:grid-cols-3">
                <div x-data="dailyPick('featured')">
                  <include src="./partials/main/business/daily-pick.html" />
                </div>
                <div x-data="dailyPick('daily')">
                  <include src="./partials/main/business/daily-pick.html" />
                </div>
                <div class="md:col-span-2 2xl:col-span-1">
                  <include src="./partials/main/business/today-notes.html" />
                </div>
              </div>
              <!-- Picks End -->

              <!-- Dashboard Start -->
              <include src="./partials/main/business/dashboard.html" />
              <!-- Dashboard End -->
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->
  </body>
</html>
