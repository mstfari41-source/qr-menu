<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Takvim | İşletme Paneli</title>
  </head>
  <body
    x-data="{ page: 'calendar', 'loaded': true, 'darkMode': false, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode')) ?? false;
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/common/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/layout/app-layout/sidebar/index.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-1 flex-col overflow-x-hidden overflow-y-auto"
      >
        <!-- ===== Main Content Start ===== -->
        <main id="main-content">
          <!-- ===== Header Start ===== -->
          <include src="./partials/layout/app-layout/header/index.html" />
          <!-- ===== Header End ===== -->

          <div
            class="mx-auto max-w-(--breakpoint-2xl) p-4 pb-20 md:p-6 md:pb-6"
          >
            <!-- Breadcrumb Start -->
            <div x-data="{ pageTitle: 'Takvim ve Notlar' }">
              <include src="./partials/common/page-breadcrumb.html" />
            </div>
            <!-- Breadcrumb End -->

            <!-- Browser notification permission -->
            <div
              x-data="{ perm: 'Notification' in window ? Notification.permission : 'unsupported' }"
              x-show="perm === 'default'"
              class="mb-5 flex flex-col gap-3 rounded-2xl border border-brand-200 bg-brand-50/60 p-4 sm:flex-row sm:items-center sm:justify-between dark:border-brand-500/30 dark:bg-brand-500/5"
            >
              <p class="text-sm text-gray-700 dark:text-gray-300">
                Hatırlatıcılar panel açıkken ekrana düşer. Başka bir sekmedeyken de görmek için tarayıcı bildirimlerine izin verin.
              </p>
              <button
                type="button"
                @click="Notification.requestPermission().then((p) => (perm = p))"
                class="shrink-0 rounded-lg bg-brand-500 px-4 py-2 text-sm font-medium text-white hover:bg-brand-600"
              >
                Bildirimlere izin ver
              </button>
            </div>

            <!-- Calendar Section Start -->
            <include src="./partials/main/calendar/index.html" />
            <!-- Calendar Section End -->
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->
  </body>
</html>
