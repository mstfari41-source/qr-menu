<div
  x-data="socialLinks()"
  class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/3"
>
  <div class="flex items-center justify-between gap-4 border-b border-gray-100 p-5 sm:p-6 dark:border-gray-800">
    <div>
      <h4 class="text-base font-semibold text-gray-800 dark:text-white/90">Sosyal Medya</h4>
      <p class="mt-0.5 text-sm text-gray-500 dark:text-gray-400">QR menünün altında gösterilecek hesaplarınız.</p>
    </div>
    <button
      type="button"
      x-show="!editing"
      @click="startEdit()"
      class="inline-flex h-10 shrink-0 items-center justify-center gap-2 rounded-lg bg-orange-50 px-4 text-sm font-medium text-orange-600 hover:bg-orange-100 ring-1 ring-orange-200 ring-inset dark:bg-orange-500/15 dark:text-orange-400 dark:ring-orange-500/30 dark:hover:bg-orange-500/25"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" /></svg>
      Düzenle
    </button>
  </div>

  <!-- View -->
  <ul x-show="!editing" class="divide-y divide-gray-100 dark:divide-white/5">
    <template x-for="n in networks" :key="n.id">
      <li class="flex flex-col gap-1 px-5 py-3.5 sm:flex-row sm:items-center sm:gap-6 sm:px-6">
        <span class="w-40 shrink-0 text-sm text-gray-500 dark:text-gray-400" x-text="n.name"></span>
        <a
          x-show="links[n.id]"
          :href="links[n.id]"
          target="_blank"
          rel="noopener"
          class="truncate text-sm font-medium text-brand-500 hover:underline"
          x-text="links[n.id]"
        ></a>
        <span x-show="!links[n.id]" class="text-sm text-gray-400 dark:text-gray-500">Eklenmedi</span>
      </li>
    </template>
  </ul>

  <!-- Edit -->
  <form x-show="editing" x-cloak @submit.prevent="save()" class="space-y-4 p-5 sm:p-6" novalidate>
    <template x-for="n in networks" :key="n.id">
      <div class="grid grid-cols-1 gap-1.5 sm:grid-cols-[10rem_1fr] sm:items-start sm:gap-6">
        <label class="text-sm font-medium text-gray-700 sm:pt-3 dark:text-gray-400" :for="'social-' + n.id" x-text="n.name"></label>
        <div>
          <input
            type="url"
            :id="'social-' + n.id"
            x-model="form[n.id]"
            :placeholder="n.placeholder"
            class="h-11 w-full rounded-lg border bg-transparent px-4 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
            :class="errors[n.id] ? 'border-red-400' : 'border-gray-300 focus:border-brand-300 dark:border-gray-700'"
          />
          <p x-show="errors[n.id]" x-text="errors[n.id]" class="mt-1.5 text-xs text-red-500"></p>
        </div>
      </div>
    </template>

    <div class="flex flex-col-reverse justify-end gap-3 pt-2 sm:flex-row">
      <button
        type="button"
        @click="editing = false"
        class="inline-flex items-center justify-center rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-700 shadow-theme-xs hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400"
      >
        Vazgeç
      </button>
      <button
        type="submit"
        class="inline-flex items-center justify-center rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white shadow-theme-xs hover:bg-brand-600"
      >
        Kaydet
      </button>
    </div>
  </form>
</div>
