<div x-data="qrCodes()" class="space-y-5">
  <!-- Info (read-only) -->
  <div
    class="flex flex-col gap-4 rounded-2xl border border-gray-200 bg-white p-4 sm:flex-row sm:items-center sm:justify-between sm:p-5 print:hidden dark:border-gray-800 dark:bg-white/3"
  >
    <div class="flex flex-wrap items-center gap-x-8 gap-y-3">
      <div>
        <span class="block text-xs text-gray-500 dark:text-gray-400">Menü adresi</span>
        <span class="text-sm font-medium text-gray-800 dark:text-white/90" x-text="baseUrl"></span>
      </div>
      <div>
        <span class="block text-xs text-gray-500 dark:text-gray-400">Masa sayısı</span>
        <span class="text-sm font-medium text-gray-800 dark:text-white/90" x-text="tableCount"></span>
      </div>
      <span class="inline-flex items-center gap-1.5 text-xs text-gray-500 dark:text-gray-400">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
        QR kodları platform yöneticisi tarafından oluşturulur; masa eklemek için yöneticiyle iletişime geçin.
      </span>
    </div>
    <button
      type="button"
      @click="window.print()"
      class="inline-flex h-11 shrink-0 items-center justify-center gap-2 rounded-lg bg-brand-500 px-4 text-sm font-medium text-white shadow-theme-xs hover:bg-brand-600"
    >
      Tümünü Yazdır
    </button>
  </div>

  <!-- QR grid -->
  <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4 2xl:grid-cols-6">
    <template x-for="t in tables" :key="t.n">
      <div
        class="flex flex-col items-center rounded-2xl border border-gray-200 bg-white p-4 text-center break-inside-avoid dark:border-gray-800 dark:bg-white/3"
      >
        <span class="text-base font-semibold text-gray-800 dark:text-white/90" x-text="'Masa ' + t.n"></span>
        <img :src="t.image" :alt="'Masa ' + t.n + ' QR kodu'" class="my-3 aspect-square w-full max-w-40 rounded-lg bg-white p-1" />
        <a
          :href="t.link"
          target="_blank"
          rel="noopener"
          class="w-full truncate text-xs text-gray-500 hover:text-brand-500 dark:text-gray-400"
          x-text="t.link"
        ></a>
        <button
          type="button"
          @click="download(t)"
          class="mt-3 w-full rounded-lg border border-gray-300 px-3 py-2 text-xs font-medium text-gray-700 hover:bg-gray-50 print:hidden dark:border-gray-700 dark:text-gray-300 dark:hover:bg-white/5"
        >
          PNG İndir
        </button>
      </div>
    </template>
  </div>
</div>
