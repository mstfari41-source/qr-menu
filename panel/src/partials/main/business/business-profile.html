<div
  x-data="businessProfile()"
  class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/3"
>
  <!-- Header -->
  <div class="flex items-center gap-4 border-b border-gray-100 p-5 sm:p-6 dark:border-gray-800">
    <img :src="info.logo" alt="Logo" class="h-16 w-16 rounded-full border border-gray-200 object-contain p-2 dark:border-gray-700" />
    <div>
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90" x-text="info.business"></h3>
      <p class="text-sm text-gray-500 dark:text-gray-400" x-text="info.owner"></p>
    </div>
  </div>

  <!-- Business info (read-only) -->
  <div class="p-5 sm:p-6">
    <div class="mb-5 flex flex-wrap items-center justify-between gap-2">
      <h4 class="text-base font-semibold text-gray-800 dark:text-white/90">İşletme Bilgileri</h4>
      <span class="inline-flex items-center gap-1.5 text-xs text-gray-500 dark:text-gray-400">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
        Bu bilgiler süper panelden yönetilir; değişiklik için bizimle iletişime geçin.
      </span>
    </div>
    <dl class="grid grid-cols-1 gap-x-8 gap-y-5 sm:grid-cols-2 lg:grid-cols-3">
      <div>
        <dt class="text-xs text-gray-500 dark:text-gray-400">Ad Soyad</dt>
        <dd class="mt-1 text-sm font-medium text-gray-800 dark:text-white/90" x-text="info.owner"></dd>
      </div>
      <div>
        <dt class="text-xs text-gray-500 dark:text-gray-400">İşletme Adı</dt>
        <dd class="mt-1 text-sm font-medium text-gray-800 dark:text-white/90" x-text="info.business"></dd>
      </div>
      <div>
        <dt class="text-xs text-gray-500 dark:text-gray-400">Telefon</dt>
        <dd class="mt-1 text-sm font-medium text-gray-800 dark:text-white/90" x-text="info.phone"></dd>
      </div>
      <div>
        <dt class="text-xs text-gray-500 dark:text-gray-400">E-posta</dt>
        <dd class="mt-1 text-sm font-medium break-all text-gray-800 dark:text-white/90" x-text="info.email"></dd>
      </div>
      <div class="sm:col-span-2">
        <dt class="text-xs text-gray-500 dark:text-gray-400">İşletme Adresi</dt>
        <dd class="mt-1 text-sm font-medium text-gray-800 dark:text-white/90" x-text="info.address"></dd>
      </div>
    </dl>
  </div>

  <!-- Password -->
  <div class="border-t border-gray-100 p-5 sm:p-6 dark:border-gray-800">
    <h4 class="text-base font-semibold text-gray-800 dark:text-white/90">Parola</h4>

    <div x-show="!editing" class="mt-3 flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
      <div class="flex flex-wrap items-center gap-x-4 gap-y-1">
        <span class="text-lg tracking-widest text-gray-800 dark:text-white/90">••••••••</span>
        <span x-show="saved" class="text-sm font-medium text-green-600 dark:text-green-500">Parolanız değiştirildi (demo).</span>
      </div>
      <button
        type="button"
        @click="startEdit()"
        class="inline-flex h-9 shrink-0 items-center justify-center gap-2 rounded-lg bg-brand-50 px-3.5 text-sm font-medium text-brand-600 ring-1 ring-brand-200 ring-inset hover:bg-brand-100 dark:bg-brand-500/15 dark:text-brand-400 dark:ring-brand-500/30 dark:hover:bg-brand-500/25"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
        Parolayı Değiştir
      </button>
    </div>

    <form x-show="editing" x-cloak @submit.prevent="savePassword()" class="mt-4 space-y-5" novalidate>
      <div class="grid grid-cols-1 gap-5 md:grid-cols-3">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Mevcut parola</label>
          <input
            x-ref="currentPassword"
            type="password"
            autocomplete="current-password"
            x-model="password.current"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
          />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Yeni parola</label>
          <input
            type="password"
            autocomplete="new-password"
            x-model="password.next"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
          />
          <p class="mt-1.5 text-xs text-gray-500 dark:text-gray-400">En az 8 karakter.</p>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Yeni parola (tekrar)</label>
          <input
            type="password"
            autocomplete="new-password"
            x-model="password.repeat"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
          />
        </div>
      </div>

      <p x-show="error" x-text="error" class="rounded-lg border border-red-200 bg-red-50 px-3.5 py-2.5 text-sm font-medium text-red-600 empty:hidden dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-400"></p>

      <div class="flex flex-col-reverse justify-end gap-3 sm:flex-row">
        <button
          type="button"
          @click="cancel()"
          class="inline-flex items-center justify-center rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-700 shadow-theme-xs hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400"
        >
          Vazgeç
        </button>
        <button
          type="submit"
          class="inline-flex items-center justify-center rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white shadow-theme-xs hover:bg-brand-600"
        >
          Parolayı Değiştir
        </button>
      </div>
    </form>
  </div>
</div>
