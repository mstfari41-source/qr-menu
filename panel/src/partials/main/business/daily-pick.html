<!-- Needs x-data="dailyPick('daily')" or dailyPick('featured') on the wrapper -->
<div class="flex h-full flex-col gap-3 rounded-2xl border p-4" :class="theme.card">
  <!-- Header -->
  <div class="flex items-center justify-between gap-3">
    <div class="flex min-w-0 items-center gap-2.5">
      <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg" :class="theme.badge">
        <!-- featured: flame, daily: sun -->
        <svg x-show="kind === 'featured'" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.2 1.6 1 2.6 2 3 0-3 .3-5.6 1-8.5z" /></svg>
        <svg x-show="kind === 'daily'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
      </span>
      <div class="min-w-0">
        <h3 class="truncate text-sm font-semibold" :class="theme.title" x-text="title"></h3>
        <p class="truncate text-xs text-gray-500 dark:text-gray-400" x-text="hint"></p>
      </div>
    </div>
    <div class="inline-flex shrink-0 rounded-lg bg-white p-0.5 shadow-theme-xs dark:bg-gray-900">
      <button
        type="button"
        @click="auto = true"
        class="rounded-md px-2.5 py-1 text-xs font-medium transition"
        :class="auto ? theme.active : 'text-gray-500 dark:text-gray-400'"
      >
        Otomatik
      </button>
      <button
        type="button"
        @click="auto = false"
        class="rounded-md px-2.5 py-1 text-xs font-medium transition"
        :class="!auto ? theme.active : 'text-gray-500 dark:text-gray-400'"
      >
        Manuel
      </button>
    </div>
  </div>

  <!-- Preview + controls -->
  <div class="flex items-center gap-3 transition" :class="shown ? '' : 'opacity-40 grayscale'">    <img :src="pick.image" :alt="pick.name" class="h-14 w-14 shrink-0 rounded-xl object-cover" />
    <div class="min-w-0 flex-1">
      <div class="flex items-baseline gap-2">
        <h4 class="truncate text-base font-semibold text-gray-800 dark:text-white/90" x-text="pick.name"></h4>
        <span class="shrink-0 text-sm text-gray-500 dark:text-gray-400" x-text="formatPrice(pick.price)"></span>
      </div>
      <include src="./ai-hint.html" />
    </div>
  </div>

  <div class="flex items-center gap-3">
    <select
      x-model="productId"
      :disabled="auto"
      :aria-label="title + ' ürünü'"
      class="h-9 min-w-0 flex-1 rounded-lg border border-gray-300 bg-white px-3 text-sm text-gray-800 focus:border-brand-300 focus:outline-hidden disabled:cursor-not-allowed disabled:opacity-50 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
    >
      <template x-for="p in products" :key="p.id">
        <option :value="p.id" x-text="p.name" :selected="p.id === productId"></option>
      </template>
    </select>

    <div class="flex shrink-0 items-center gap-2">
      <button
        type="button"
        role="switch"
        :aria-checked="shown.toString()"
        @click="shown = !shown"
        :aria-label="title + ': ' + toggleLabel"
        class="relative inline-flex h-5 w-9 shrink-0 items-center rounded-full p-[2px] transition-colors"
        :class="shown ? theme.switchOn : 'bg-gray-300 dark:bg-gray-700'"
      >
        <span class="pointer-events-none block h-4 w-4 rounded-full bg-white shadow-theme-sm transition-transform duration-150" :class="shown ? 'translate-x-4' : 'translate-x-0'"></span>
      </button>
      <span class="text-xs text-gray-700 dark:text-gray-400" x-text="toggleLabel"></span>
    </div>
  </div>
</div>
