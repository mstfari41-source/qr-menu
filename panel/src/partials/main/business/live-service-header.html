<div x-data="qrFeatures()" class="mb-6 flex flex-wrap items-center gap-x-6 gap-y-3">
  <h2 class="text-xl font-semibold text-gray-800 dark:text-white/90">Canlı Servis</h2>

  <!-- QR menu quick switches -->
  <div class="flex flex-wrap items-center gap-2">
    <template x-for="(f, key) in features" :key="key">
      <button
        type="button"
        role="switch"
        :aria-checked="$store.features[key].toString()"
        @click="toggle(key)"
        class="inline-flex h-9 items-center gap-2.5 rounded-full border py-1 ps-3 pe-1.5 text-sm font-medium transition"
        :class="$store.features[key] ? 'border-green-200 bg-green-50 text-green-700 dark:border-green-500/30 dark:bg-green-500/10 dark:text-green-400' : 'border-gray-300 bg-gray-100 text-gray-500 dark:border-gray-700 dark:bg-white/5 dark:text-gray-400'"
        :title="'QR menüde ' + f.name + ($store.features[key] ? ' açık' : ' kapalı')"
      >
        <span x-text="'QR ' + f.name"></span>
        <span class="text-xs font-semibold" x-text="$store.features[key] ? 'Açık' : 'Kapalı'"></span>
        <span class="relative inline-flex h-5 w-9 shrink-0 items-center rounded-full p-[2px] transition-colors" :class="$store.features[key] ? 'bg-green-500' : 'bg-gray-300 dark:bg-gray-600'">
          <span class="block h-4 w-4 rounded-full bg-white shadow-theme-sm transition-transform duration-150" :class="$store.features[key] ? 'translate-x-4' : 'translate-x-0'"></span>
        </span>
      </button>
    </template>
  </div>

  <nav class="ms-auto">
    <ol class="flex items-center gap-1.5 text-sm">
      <li><a class="text-gray-500 dark:text-gray-400" href="index.html">Ana Sayfa</a></li>
      <li class="text-gray-400">›</li>
      <li class="text-gray-800 dark:text-white/90">Canlı Servis</li>
    </ol>
  </nav>
</div>
