<!-- Super panel header -->
<header class="sticky top-0 z-50 flex w-full shrink-0 border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900">
  <div class="flex grow items-center justify-between gap-2 px-3 py-3 sm:gap-4 xl:px-6 xl:py-4">
    <div class="flex min-w-0 items-center gap-3">
      <button
        type="button"
        @click.stop="sidebarToggle = !sidebarToggle"
        aria-label="Menüyü aç/kapat"
        class="inline-flex size-10 shrink-0 items-center justify-center rounded-[10px] border border-gray-300 text-gray-500 shadow-theme-xs hover:bg-gray-50 hover:text-gray-800 lg:size-11 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700/50 dark:hover:text-white"
      >
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M1 1h14M1 11h14M1 6h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
      </button>
      <span class="inline-flex items-center gap-1.5 rounded-lg bg-gray-900 px-2.5 py-1.5 text-xs font-semibold text-white dark:bg-white dark:text-gray-900">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z" /></svg>
        Süper Panel
      </span>
    </div>

    <div class="flex shrink-0 items-center gap-2 sm:gap-3">
      <include src="../app-layout/header/theme-toggler.html" />
      <span class="mx-1 h-8 w-px bg-gray-200 sm:mx-2 dark:bg-gray-800" aria-hidden="true"></span>
      <div class="flex items-center gap-3">
        <img src="/images/logo/ari-medya.png" alt="" class="size-10 rounded-full border border-gray-200 object-contain dark:border-gray-700 dark:bg-white" />
        <span class="hidden text-sm leading-tight sm:block">
          <span class="block font-medium text-gray-800 dark:text-white/90">ARI Medya</span>
          <span class="block text-xs text-gray-500 dark:text-gray-400">Platform yöneticisi</span>
        </span>
      </div>
      <a
        href="/super/giris"
        title="Çıkış yap"
        aria-label="Çıkış yap"
        class="inline-flex size-10 items-center justify-center rounded-[10px] text-gray-500 hover:bg-gray-100 hover:text-red-500 dark:text-gray-400 dark:hover:bg-white/5"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5M14 16l4-4-4-4M18 12H9" /></svg>
      </a>
    </div>
  </div>
</header>
