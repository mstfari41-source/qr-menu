<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Lokanta menüsü</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#4A5725}a:hover{color:#36401B}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1040px; box-sizing: border-box; background: #F3EEE3; font-family: Urbanist, system-ui, sans-serif; color: #2A2A22; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 18px 16px 4px">
    <div style="width: 48px; height: 48px; border-radius: 24px; background: #FFFDF8; box-shadow: 0 0 0 3px {{accentSoft}}; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 800; color: {{accent}}">H</div>
    <span style="font-size: 20px; font-weight: 600; flex-grow: 1">Hacı Usta Lokantası</span>
    <button aria-label="Dil seç" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #E3DCCB; background: #FFFDF8; font-size: 12px; font-weight: 600; color: #2A2A22">TR</button>
  </div>
  <p style="margin: 6px 16px 12px; font-size: 15px; font-weight: 500; color: #6A6658">Hoş geldiniz, Masa 4</p>

  <div style="display: flex; align-items: center; gap: 8px; margin: 0 16px 18px; background: {{accent}}; color: #FFFFFF; border-radius: 14px; padding: 10px 14px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"></path></svg>
    <span style="font-size: 14px; font-weight: 600; flex-grow: 1">Salı, 18 Kasım · Öğle servisi</span>
    <span style="font-size: 12px; opacity: 0.9">11:40'ta güncellendi</span>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between; margin: 0 16px 10px">
    <span style="font-size: 16px; font-weight: 500">Bugün ocakta</span>
    <span style="font-size: 12px; color: #6A6658">6 çeşit · 1 tükendi</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 16px">
    <sc-for list="{{dishes}}" as="d" hint-placeholder-count="6">
      <div style="background: #FFFDF8; border-radius: 18px; padding: 12px; box-shadow: 0 4px 12px rgba(80,60,20,0.08); display: flex; flex-direction: column; gap: 8px; opacity: {{d.opacity}}">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="width: 38px; height: 38px; border-radius: 19px; background: {{d.tint}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A2A22" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18"></path><path d="M5 11v4a5 5 0 0 0 5 5h4a5 5 0 0 0 5-5v-4"></path><path d="M9 7c0-1 1-1.5 1-2.5M13 7c0-1 1-1.5 1-2.5"></path></svg></span>
          <sc-if value="{{d.soldOut}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 11px; font-weight: 700; color: #FFFFFF; background: #9C4A2F; padding: 3px 8px; border-radius: 10px">Tükendi</span>
          </sc-if>
          <sc-if value="{{d.isNew}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 11px; font-weight: 700; color: {{accentInk}}; background: {{accentSoft}}; padding: 3px 8px; border-radius: 10px">Yeni çıktı</span>
          </sc-if>
        </div>
        <div style="display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 15px; font-weight: 600; text-decoration: {{d.deco}}">{{d.name}}</span>
          <span style="font-size: 12px; color: #6A6658">{{d.desc}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
          <button style="height: 40px; border-radius: 20px; border: {{d.halfBorder}}; background: {{d.halfBg}}; color: {{d.halfColor}}; font-size: 12px; font-weight: {{d.halfWeight}}; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1"><span>Yarım</span><span>{{d.half}}</span></button>
          <button style="height: 40px; border-radius: 20px; border: {{d.fullBorder}}; background: {{d.fullBg}}; color: {{d.fullColor}}; font-size: 12px; font-weight: {{d.fullWeight}}; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1"><span>Tam</span><span>{{d.full}}</span></button>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="margin: 16px 16px 0; background: #FFFDF8; border-radius: 18px; padding: 16px 16px 14px; box-shadow: 0 4px 12px rgba(80,60,20,0.10); display: flex; flex-direction: column; gap: 8px; border-top: 6px solid {{accent}}">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 16px; font-weight: 600">Tabağınız</span>
      <span style="font-size: 12px; color: #6A6658; letter-spacing: 0.5px">ADİSYON · MASA 4</span>
    </div>
    <div style="border-top: 1px dashed #CFC6B2"></div>
    <div style="display: flex; align-items: baseline; gap: 6px; font-size: 14px"><span>Kuru fasulye · Tam</span><span style="flex-grow: 1; border-bottom: 1px dotted #BDB4A0"></span><span style="font-weight: 600">170 ₺</span></div>
    <div style="display: flex; align-items: baseline; gap: 6px; font-size: 14px"><span>Pirinç pilavı · Yarım</span><span style="flex-grow: 1; border-bottom: 1px dotted #BDB4A0"></span><span style="font-weight: 600">55 ₺</span></div>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #6A6658"><span style="flex-grow: 1">Yanına çorba?</span><button style="height: 30px; padding: 0 12px; border-radius: 15px; border: 1px dashed #A9A08B; background: transparent; color: #2A2A22; font-size: 12px">+ Mercimek 50 ₺</button></div>
    <div style="border-top: 1px dashed #CFC6B2; margin-top: 2px"></div>
    <div style="display: flex; align-items: center; gap: 12px; padding-right: 64px">
      <div style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 12px; color: #6A6658">Toplam</span><span style="font-size: 22px; font-weight: 800">225 ₺</span></div>
      <button style="height: 46px; padding: 0 18px; border-radius: 23px; border: 0; background: {{accent}}; color: #FFFFFF; font-size: 15px; font-weight: 600">Garsona ilet</button>
    </div>
  </div>

  <div style="position: absolute; right: 16px; bottom: 22px; display: flex; flex-direction: column; gap: 12px">
    <button aria-label="Sepet" style="width: 56px; height: 56px; border-radius: 28px; border: 0; background: #2A2A22; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,0.25)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg></button>
    <button aria-label="Garson çağır" style="width: 56px; height: 56px; border-radius: 28px; border: 0; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,0.25)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17h16"></path><path d="M5 17a7 7 0 0 1 14 0"></path><path d="M12 8V6"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5B6B2E","options":["#5B6B2E","#9C4A2F","#1E3A5F","#0F7B6C"]},"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  mix(hex, amt, base) {
    const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
    const a = p(hex), b = p(base);
    return '#' + a.map((v, i) => Math.round(v * amt + b[i] * (1 - amt)).toString(16).padStart(2, '0')).join('');
  }
  renderVals() {
    const accent = this.props.accent ?? '#5B6B2E';
    const accentSoft = this.mix(accent, 0.15, '#FFFFFF');
    const accentInk = this.mix(accent, 0.75, '#000000');
    const on = { b: '1px solid ' + accent, bg: accent, c: '#FFFFFF', w: 700 };
    const off = { b: '1px solid #E3DCCB', bg: '#FFFDF8', c: '#2A2A22', w: 500 };
    const raw = [
      { name: 'Kuru fasulye', desc: 'Pastırmalı', half: '110 ₺', full: '170 ₺', tint: '#F1E2C6', pick: 'full' },
      { name: 'Pirinç pilavı', desc: 'Tereyağlı', half: '55 ₺', full: '85 ₺', tint: '#EEEADF', pick: 'half' },
      { name: 'Mercimek çorbası', desc: 'Limon, kıtır ekmek', half: '50 ₺', full: '80 ₺', tint: '#F5D8B5' },
      { name: 'Tavuk sote', desc: 'Biberli, domatesli', half: '130 ₺', full: '200 ₺', tint: '#F3E3BE', isNew: true },
      { name: 'Zeytinyağlı fasulye', desc: 'Soğuk servis', half: '90 ₺', full: '140 ₺', tint: '#DFE6CF' },
      { name: 'Karnıyarık', desc: 'Kıymalı', half: '140 ₺', full: '220 ₺', tint: '#E8D3D6', soldOut: true }
    ];
    const dishes = raw.map((d) => {
      const h = d.pick === 'half' ? on : off;
      const f = d.pick === 'full' ? on : off;
      return {
        ...d,
        soldOut: !!d.soldOut,
        isNew: !!d.isNew,
        opacity: d.soldOut ? 0.5 : 1,
        deco: d.soldOut ? 'line-through' : 'none',
        halfBorder: h.b, halfBg: h.bg, halfColor: h.c, halfWeight: h.w,
        fullBorder: f.b, fullBg: f.bg, fullColor: f.c, fullWeight: f.w
      };
    });
    return { accent, accentSoft, accentInk, dishes };
  }
}
</script>
</body>
</html>
