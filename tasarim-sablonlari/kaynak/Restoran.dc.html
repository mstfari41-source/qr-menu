<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Restoran menüsü</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#E3C994}a:hover{color:#F0DDB5}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1040px; box-sizing: border-box; background: #16130F; font-family: Urbanist, system-ui, sans-serif; color: #F2ECE2; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 18px 16px 4px">
    <div style="width: 48px; height: 48px; border-radius: 24px; background: #211C17; box-shadow: 0 0 0 3px {{accentSoft}}; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700; color: {{accent}}">M</div>
    <span style="font-size: 20px; font-weight: 600; flex-grow: 1">Mavi Kapı</span>
    <button aria-label="Dil seç" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #3A322A; background: #211C17; font-size: 12px; font-weight: 600; color: #F2ECE2">TR</button>
  </div>
  <p style="margin: 6px 16px 14px; font-size: 15px; font-weight: 500; color: #A89F92">İyi akşamlar, Masa 12</p>

  <div style="position: relative; margin: 0 16px 18px; height: 236px; border-radius: 18px; overflow: hidden; background: #2E1B17; box-shadow: 0 10px 30px rgba(0,0,0,0.5)">
    <img src="/_blob/4e634ed5b088a1dbb882fc9aede43777" alt="Fıstıklı künefe" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover">
    <div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(22,19,15,0) 35%, rgba(22,19,15,0.92) 100%)"></div>
    <div style="position: absolute; left: 0; top: 0; width: 104px; height: 104px; background: {{accent}}; clip-path: polygon(0 0, 100% 0, 0 100%)">
      <span style="position: absolute; left: -14px; top: 24px; width: 100px; text-align: center; transform: rotate(-45deg); font-size: 12px; font-weight: 700; line-height: 1.15; color: #16130F">Şefin önerisi</span>
    </div>
    <div style="position: absolute; left: 16px; right: 74px; bottom: 16px; display: flex; flex-direction: column">
      <span style="font-size: 12px; color: #D6CEC2">Bu akşam · Tatlı</span>
      <span style="margin-top: 2px; font-size: 24px; font-weight: 700; line-height: 1.1">Fıstıklı künefe</span>
      <span style="margin-top: 4px; font-size: 13px; color: #D6CEC2">Antep fıstığı, kaymak · sıcak servis</span>
    </div>
    <span style="position: absolute; right: 16px; bottom: 18px; font-size: 20px; font-weight: 700; color: {{accent}}">320 ₺</span>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 16px 16px; overflow: hidden">
    <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #3A322A; background: transparent; color: #F2ECE2; font-size: 13px; white-space: nowrap">Başlangıçlar</button>
    <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #3A322A; background: transparent; color: #F2ECE2; font-size: 13px; white-space: nowrap">Ara sıcaklar</button>
    <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{accent}}; background: {{accentSoft}}; color: {{accentInk}}; font-size: 13px; font-weight: 600; white-space: nowrap">Ana yemekler</button>
    <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #3A322A; background: transparent; color: #F2ECE2; font-size: 13px; white-space: nowrap">Tatlılar</button>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; margin: 0 16px 4px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 2px; color: {{accent}}">ANA YEMEKLER</span>
    <span style="flex-grow: 1; height: 1px; background: #3A322A"></span>
  </div>

  <div style="margin: 0 16px; display: flex; flex-direction: column">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
      <div style="padding: 14px 0; border-bottom: {{it.line}}; display: flex; flex-direction: column; gap: 5px">
        <div style="display: flex; align-items: baseline; gap: 8px">
          <span style="font-size: 17px; font-weight: 600">{{it.name}}</span>
          <span style="flex-grow: 1; border-bottom: 1px dotted #4A4036; transform: translateY(-4px)"></span>
          <span style="font-size: 16px; font-weight: 700; color: {{accent}}">{{it.price}}</span>
        </div>
        <span style="font-size: 13px; color: #A89F92">{{it.desc}}</span>
        <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px">
          <sc-for list="{{it.tags}}" as="t" hint-placeholder-count="2">
            <span style="font-size: 11px; font-weight: 600; color: #D6CEC2; border: 1px solid #3A322A; padding: 3px 8px; border-radius: 10px">{{t}}</span>
          </sc-for>
        </div>
        <sc-if value="{{it.pair}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 12px; font-weight: 600; color: {{accentInk}}; margin-top: 2px">Yanında iyi gider: {{it.pair}}</span>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; right: 16px; bottom: 22px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px">
    <button aria-label="Sepet" style="width: 56px; height: 56px; border-radius: 28px; border: 0; background: #F2ECE2; color: #16130F; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,0.5)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg></button>
    <button style="height: 56px; padding: 0 20px 0 16px; border-radius: 28px; border: 0; background: {{accent}}; color: #16130F; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; box-shadow: 0 6px 16px rgba(0,0,0,0.5)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17h16"></path><path d="M5 17a7 7 0 0 1 14 0"></path><path d="M12 8V6"></path></svg>Garson çağır</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C9A46A","options":["#C9A46A","#B8A1D9","#8FC1B0","#E0A48A"]},"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  mix(hex, amt, base) {
    const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
    const a = p(hex), b = p(base);
    return '#' + a.map((v, i) => Math.round(v * amt + b[i] * (1 - amt)).toString(16).padStart(2, '0')).join('');
  }
  renderVals() {
    const accent = this.props.accent ?? '#C9A46A';
    const raw = [
      { name: 'Kuzu incik', price: '640 ₺', desc: 'Altı saat fırında, közlenmiş patlıcan beğendi', tags: ['Glutensiz', 'Şefin imzası'], pair: 'Közde biber salatası' },
      { name: 'Levrek buğulama', price: '580 ₺', desc: 'Sebze yatağında, limonlu tereyağı sos', tags: ['Glutensiz', 'Deniz ürünü'], pair: '' },
      { name: 'Karışık ızgara', price: '1.450 ₺', desc: 'Pirzola, Adana, tavuk şiş, közlenmiş sebze', tags: ['2–4 kişilik', 'Paylaşım'], pair: '' },
      { name: 'Mantarlı risotto', price: '420 ₺', desc: 'Porçini mantarı, parmesan, taze kekik', tags: ['Vejetaryen', 'Süt ürünü'], pair: '' }
    ];
    return {
      accent,
      accentSoft: this.mix(accent, 0.18, '#16130F'),
      accentInk: this.mix(accent, 0.7, '#FFFFFF'),
      items: raw.map((it, i) => ({ ...it, line: i === raw.length - 1 ? '0' : '1px solid #2E2721' }))
    };
  }
}
</script>
</body>
</html>
