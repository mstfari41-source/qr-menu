<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizzacı menüsü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#A8251D}a:hover{color:#861D17}
button{font-family:inherit;cursor:pointer}
</style>
<style>body{margin:0;background:#E9E6E1;display:flex;justify-content:center}</style>
</head>
<body>
<div style="width: 390px; height: 1040px; box-sizing: border-box; background: #FFFBF5; font-family: Urbanist, system-ui, sans-serif; color: #1F1F1F; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 18px 16px 4px">
    <div style="width: 48px; height: 48px; border-radius: 24px; background: #D2342A; box-shadow: 0 0 0 3px #fae7e5; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 800; color: #FFFFFF">F</div>
    <span style="font-size: 20px; font-weight: 600; flex-grow: 1">Fırın Pizza</span>
    <button aria-label="Dil seç" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #F0E6DA; background: #FFFFFF; font-size: 12px; font-weight: 600; color: #1F1F1F">TR</button>
  </div>
  <p style="margin: 6px 16px 14px; font-size: 15px; font-weight: 500; color: #6B6B6B">Hoş geldiniz, Masa 3</p>

  <div style="position: relative; margin: 0 16px 20px; height: 112px; border-radius: 18px; overflow: hidden; background: #D2342A; color: #FFFFFF; box-shadow: 0 6px 18px rgba(160,40,30,0.25)">
    <img src="../images/pizza-karisik.jpg" alt="" style="position: absolute; right: -36px; top: -14px; width: 150px; height: 150px; border-radius: 75px; object-fit: cover; box-shadow: 0 0 0 6px rgba(255,255,255,0.18)">
    <div style="position: absolute; left: 16px; top: 14px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 700; color: #1F1F1F; background: #FFFFFF; padding: 3px 9px; border-radius: 10px; align-self: flex-start">Bu hafta</span>
      <span style="font-size: 30px; font-weight: 800; line-height: 1">2. pizza %50</span>
      <span style="font-size: 13px; opacity: 0.92">Sepette kendiliğinden uygulanır</span>
    </div>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between; margin: 0 16px 10px">
    <span style="font-size: 16px; font-weight: 500">Pizzalar</span>
    <span style="font-size: 12px; color: #6B6B6B">Kaydır</span>
  </div>
  <div style="display: flex; gap: 14px; padding: 0 16px 20px; overflow: hidden">
    
      <div style="flex-shrink: 0; width: 100px; display: flex; flex-direction: column; align-items: center; gap: 6px">
        <img src="../images/pizza-margherita.jpg" alt="" style="width: 100px; height: 100px; border-radius: 50px; object-fit: cover; box-shadow: 0 6px 14px rgba(0,0,0,0.16)">
        <span style="font-size: 14px; font-weight: 600">Margarita</span>
        <span style="font-size: 12px; color: #6B6B6B; margin-top: -4px">230 ₺'den</span>
      </div>
    
      <div style="flex-shrink: 0; width: 100px; display: flex; flex-direction: column; align-items: center; gap: 6px">
        <img src="../images/pizza-sucuklu.jpg" alt="" style="width: 100px; height: 100px; border-radius: 50px; object-fit: cover; box-shadow: 0 6px 14px rgba(0,0,0,0.16)">
        <span style="font-size: 14px; font-weight: 600">Sucuklu</span>
        <span style="font-size: 12px; color: #6B6B6B; margin-top: -4px">260 ₺'den</span>
      </div>
    
      <div style="flex-shrink: 0; width: 100px; display: flex; flex-direction: column; align-items: center; gap: 6px">
        <img src="../images/pizza-karisik.jpg" alt="" style="width: 100px; height: 100px; border-radius: 50px; object-fit: cover; box-shadow: 0 6px 14px rgba(0,0,0,0.16)">
        <span style="font-size: 14px; font-weight: 600">Karışık</span>
        <span style="font-size: 12px; color: #6B6B6B; margin-top: -4px">280 ₺'den</span>
      </div>
    
      <div style="flex-shrink: 0; width: 100px; display: flex; flex-direction: column; align-items: center; gap: 6px">
        <img src="../images/pizza-margherita.jpg" alt="" style="width: 100px; height: 100px; border-radius: 50px; object-fit: cover; box-shadow: 0 6px 14px rgba(0,0,0,0.16)">
        <span style="font-size: 14px; font-weight: 600">Klasik</span>
        <span style="font-size: 12px; color: #6B6B6B; margin-top: -4px">250 ₺'den</span>
      </div>
    
  </div>

  <div style="margin: 0 16px; background: #FFFFFF; border-radius: 18px; padding: 16px; box-shadow: 0 4px 14px rgba(80,50,20,0.10); display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 16px; font-weight: 600">Kendi pizzanı yap</span>
      <span style="font-size: 12px; font-weight: 700; color: #FFFFFF; background: #3F7D3A; padding: 3px 9px; border-radius: 10px">Yarım yarım</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="position: relative; width: 132px; height: 132px; border-radius: 66px; overflow: hidden; flex-shrink: 0; box-shadow: 0 8px 18px rgba(0,0,0,0.18)">
        <div style="position: absolute; left: 0; top: 0; width: 66px; height: 132px; overflow: hidden"><img src="../images/pizza-margherita.jpg" alt="Sol yarı: Margarita" style="width: 132px; height: 132px; object-fit: cover; display: block"></div>
        <div style="position: absolute; left: 66px; top: 0; width: 66px; height: 132px; overflow: hidden"><img src="../images/pizza-sucuklu.jpg" alt="Sağ yarı: Sucuklu" style="width: 132px; height: 132px; object-fit: cover; display: block; margin-left: -66px"></div>
        <div style="position: absolute; left: 65px; top: 0; width: 2px; height: 132px; background: #FFFFFF"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
        <button style="height: 40px; border-radius: 20px; border: 1px solid #F0E6DA; background: #FFFBF5; color: #1F1F1F; font-size: 13px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px"><span style="color: #6B6B6B">Sol</span><span style="font-weight: 600">Margarita</span></button>
        <button style="height: 40px; border-radius: 20px; border: 1px solid #F0E6DA; background: #FFFBF5; color: #1F1F1F; font-size: 13px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px"><span style="color: #6B6B6B">Sağ</span><span style="font-weight: 600">Sucuklu</span></button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end">
      <button style="height: 86px; border-radius: 16px; border: 1px solid #F0E6DA; background: #FFFFFF; color: #1F1F1F; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; padding-bottom: 8px"><span style="width: 26px; height: 26px; border-radius: 13px; background: #F7D9A8; border: 2px solid #E9B864; box-sizing: border-box"></span><span style="font-size: 13px; font-weight: 500">Küçük</span><span style="font-size: 11px; color: #6B6B6B">1 kişi</span></button>
      <button style="height: 86px; border-radius: 16px; border: 1px solid #D2342A; background: #fae7e5; color: #97251e; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; padding-bottom: 8px"><span style="width: 34px; height: 34px; border-radius: 17px; background: #F7D9A8; border: 2px solid #E9B864; box-sizing: border-box"></span><span style="font-size: 13px; font-weight: 700">Orta</span><span style="font-size: 11px">2 kişi</span></button>
      <button style="height: 86px; border-radius: 16px; border: 1px solid #F0E6DA; background: #FFFFFF; color: #1F1F1F; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; padding-bottom: 8px"><span style="width: 42px; height: 42px; border-radius: 21px; background: #F7D9A8; border: 2px solid #E9B864; box-sizing: border-box"></span><span style="font-size: 13px; font-weight: 500">Büyük</span><span style="font-size: 11px; color: #6B6B6B">3–4 kişi</span></button>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #D2342A; background: #fae7e5; color: #97251e; font-size: 13px; font-weight: 600">İnce hamur</button>
      <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #F0E6DA; background: #FFFFFF; color: #1F1F1F; font-size: 13px">Klasik</button>
      <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #F0E6DA; background: #FFFFFF; color: #1F1F1F; font-size: 13px">Kalın kenar</button>
      <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #CFE0CC; background: #EEF5EC; color: #2F5F2B; font-size: 13px; font-weight: 600">+ Ekstra peynir</button>
    </div>

    <button style="height: 50px; border-radius: 25px; border: 0; background: #D2342A; color: #FFFFFF; font-size: 16px; font-weight: 700; margin-right: 64px">Sepete ekle · 355 ₺</button>
  </div>

  <div style="position: absolute; right: 16px; bottom: 22px; display: flex; flex-direction: column; gap: 12px">
    <button aria-label="Sepet" style="width: 56px; height: 56px; border-radius: 28px; border: 0; background: #1F1F1F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,0.25)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg></button>
    <button aria-label="Garson çağır" style="width: 56px; height: 56px; border-radius: 28px; border: 0; background: #3F7D3A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,0.25)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17h16"></path><path d="M5 17a7 7 0 0 1 14 0"></path><path d="M12 8V6"></path></svg></button>
  </div>
</div>
</body>
</html>
