<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MA Coffee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
  FOTOĞRAFLAR
  Bu dosyanın yanına "images" adında bir klasör aç ve fotoğrafları şu adlarla koy (.jpg):

  Logo:        images/logo.jpg
  Kategoriler: images/kahvalti.jpg, kahve.jpg, burger.jpg, pizza.jpg, tatli.jpg, icecek.jpg
  Ürünler:     aşağıdaki PRODUCTS listesindeki id değeri = dosya adı
               (örnek: images/kahvalti-menemen.jpg)

  Fotoğraf yoksa o alanda ürünün baş harfi görünür, sayfa bozulmaz.
  Menü sayfasına masa numarası eklemek için: index.html?masa=5
  Dili adresten seçmek için: index.html?dil=en  (tr, en, de, ru)
-->
    <style>
      :root {
        --ink: #1f1f1f;
        --muted: #8a8a8a;
        --line: #ececec;
        --soft: #f6f6f6;
        --accent: #0f7b6c;
        /* Panelden başka renk seçilirse açık ve koyu tonu ondan türer */
        --accent-soft: color-mix(in srgb, var(--accent) 12%, #fff);
        --accent-ink: color-mix(in srgb, var(--accent) 72%, #000);
        --star: #ff9500;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: #f1f1f1;
        color: var(--ink);
        font-family:
          "Urbanist",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 15px;
        line-height: 1.35;
      }
      button {
        font-family: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      /* Menü içeriği biraz daha küçük. Açılan pencereler ve sabit butonlar küçültülmez,
         böylece her tarayıcıda ekranın doğru yerinde kalırlar. */
      .zm {
        zoom: 0.9;
      }
      /* Açılış ekranı (QR okutulunca) */
      .splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--ink);
      }
      .splash img,
      .splash .ph {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 0 0 1px var(--line);
        display: grid;
        place-items: center;
        font-size: 34px;
      }
      .splash b {
        margin-top: 14px;
        font-size: 24px;
        font-weight: 600;
      }
      .splash.in img,
      .splash.in .ph {
        animation: splashin 0.6s ease-out both;
      }
      .splash.in b {
        animation: splashfade 0.5s 0.35s both;
      }
      .splash.go {
        transition: transform 0.55s cubic-bezier(0.6, 0, 0.3, 1);
        transform: translateY(-100%);
      }
      @keyframes splashin {
        from {
          opacity: 0;
          transform: scale(0.88);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes splashfade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash.in img,
        .splash.in .ph,
        .splash.in b {
          animation: none;
        }
        .splash.go {
          transition: opacity 0.3s;
          transform: none;
          opacity: 0;
        }
      }
      #app {
        max-width: 430px;
        margin: 0 auto;
        min-height: 100vh;
        background: #fff;
        padding-bottom: 160px;
      }

      .top {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 16px 14px;
      }
      .top .grow {
        flex: 1;
        min-width: 0;
      }
      .top h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      .top small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .logo {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        object-fit: cover;
        flex: none;
      }
      .ibtn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: #fff;
        display: grid;
        place-items: center;
        position: relative;
        cursor: pointer;
        flex: none;
      }
      .badge {
        position: absolute;
        top: -5px;
        right: -5px;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        display: grid;
        place-items: center;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 6px;
        padding: 16px 16px 4px;
      }
      .welcome {
        margin: 0 16px 12px;
        font-size: 15px;
        font-weight: 500;
        color: var(--muted);
      }
      .brand .grow {
        flex: 1;
        min-width: 0;
      }
      .brand h1 {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.15;
      }
      .brand small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
      }
      .blogo {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        object-fit: cover;
        flex: none;
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .blogo.ph {
        font-size: 20px;
        display: grid;
        place-items: center;
      }

      .sec {
        font-size: 16px;
        font-weight: 500;
        margin: 0 16px 12px;
      }
      #app.v-home {
        background: #fafafa;
      }
      .v-home .list {
        background: #fff;
        margin: 0 16px;
        padding: 0 14px;
        border-radius: 18px;
      }
      .cats {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 0 16px;
        margin-bottom: 24px;
      }
      .card {
        position: relative;
        display: block;
        width: 100%;
        height: 80px;
        border: 0;
        border-radius: 18px;
        overflow: hidden;
        background: #fff;
        cursor: pointer;
        text-align: left;
        padding: 0;
        box-shadow: 0 4px 12px rgba(80, 50, 20, 0.12);
      }
      .cimg {
        position: absolute;
        top: 0;
        right: 0;
        width: 64%;
        height: 100%;
        object-fit: cover;
        -webkit-mask-image: linear-gradient(to right, transparent, #000 60%);
        mask-image: linear-gradient(to right, transparent, #000 60%);
      }
      .card .txt {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100%;
        padding: 0 18px;
        max-width: 64%;
      }
      .card b {
        display: block;
        font-size: 18px;
        font-weight: 500;
      }
      .card small {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        color: var(--muted);
      }

      .stories {
        display: flex;
        gap: 6px;
        padding: 0 16px;
        margin-bottom: 20px;
        overflow-x: auto;
        scroll-snap-type: x proximity;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .stories::-webkit-scrollbar {
        display: none;
      }
      .story {
        flex: none;
        width: 60px;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        scroll-snap-align: start;
        text-align: center;
      }
      .ring {
        display: block;
        width: 60px;
        height: 60px;
        border-radius: 30%;
        overflow: hidden;
        margin-bottom: 6px;
      }
      .simg {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 30%;
        object-fit: cover;
      }
      .ring {
        position: relative;
      }
      /* Fırsat şeridi: her kart küçük bir afiş, mesaj kartın üstünde */
      .tile {
        flex: none;
        width: 92px;
        height: 132px;
        border: 0;
        border-radius: 18px;
        position: relative;
        overflow: hidden;
        color: #fff;
        padding: 9px 8px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        text-align: left;
        font: inherit;
        cursor: pointer;
        scroll-snap-align: start;
      }
      .tile .timg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.3;
      }
      .tile.photo .timg {
        opacity: 1;
      }
      /* Fotoğrafı olmayan üründe harf yer tutucusu afişte ve kuponda gösterilmez */
      .tile .timg.ph,
      .cphead .cpimg.ph {
        display: none;
      }
      .dimg.ph,
      .cthumb.ph,
      .dlimg.ph {
        display: grid;
        place-items: center;
        font-size: 28px;
      }
      .tile.photo::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(transparent 40%, rgba(0, 0, 0, 0.72));
      }
      .tile > span {
        position: relative;
        z-index: 1;
      }
      .tile .tt {
        font-size: 11px;
        font-weight: 500;
        line-height: 1.2;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .tile .tb {
        display: block;
        font-weight: 800;
        line-height: 0.95;
      }
      .tile .ts {
        display: block;
        margin-top: 3px;
        font-size: 11px;
        font-weight: 500;
      }
      .tile s {
        opacity: 0.7;
      }

      /* Fırsat destesi: kartlar üst üste, yana kaydırılır */
      .deckov {
        flex-direction: column;
        gap: 14px;
      }
      .deck {
        position: relative;
        width: min(330px, 100%);
        height: 450px;
      }
      .dcard {
        position: absolute;
        inset: 0;
        border-radius: 24px;
        overflow: hidden;
        color: #fff;
        display: flex;
        flex-direction: column;
        padding: 18px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.3);
        touch-action: pan-y;
        user-select: none;
      }
      .dcard.b1 {
        transform: translate(10px, 8px) rotate(3deg);
        opacity: 0.85;
      }
      .dcard.b2 {
        transform: translate(20px, 16px) rotate(6deg);
        opacity: 0.6;
      }
      .dcard.front {
        z-index: 3;
        animation: deckin 0.25s ease-out;
      }
      .dcard.fly {
        transition: transform 0.2s ease-in, opacity 0.2s ease-in;
        opacity: 0;
      }
      @keyframes deckin {
        from {
          transform: scale(0.95);
        }
        to {
          transform: none;
        }
      }
      .dk {
        margin: 0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        opacity: 0.9;
      }
      .dcard h3 {
        margin: 6px 0 0;
        font-size: 24px;
        font-weight: 800;
        line-height: 1.1;
      }
      .dd {
        margin: 6px 0 0;
        font-size: 14px;
        opacity: 0.85;
      }
      .dimg {
        width: 100%;
        height: 170px;
        object-fit: cover;
        border-radius: 16px;
        margin-top: 12px;
        flex: none;
      }
      .dprice {
        margin-top: 10px;
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .dprice s {
        font-size: 15px;
        opacity: 0.65;
      }
      .dprice b {
        font-size: 30px;
        font-weight: 800;
      }
      .dcta {
        margin-top: auto;
        height: 52px;
        border: 0;
        border-radius: 14px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        flex: none;
      }
      .cpair {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 18px 0 8px;
        font-size: 28px;
        font-weight: 800;
        color: #f5c542;
      }
      .cthumb {
        width: 90px;

        border-radius: 20px;
        object-fit: cover;
      }
      .dsave {

        font-weight: 700;
      }
      .dlist {
        margin-top: 12px;
        display: flex;

      }
      .dli {
        display: flex;
        align-items: center;

      .dli .grow {
        flex: 1;
        min-width: 0;
      }
      .dli b {
        display: block;

        font-weight: 600;
      }
      .dli small {
        font-size: 13px;

      }
      .dlimg {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        object-fit: cover;
        flex: none;
      }
      .dadd {
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        display: grid;
        place-items: center;
        cursor: pointer;
        flex: none;
      }
      /* Kupon: kesik çizgili, çentikli */
      .dcard.cp {
        background: #fff;
        color: var(--ink);
        padding: 0;
      }
      .cphead {
        position: relative;
        background: #e5484d;
        color: #fff;
        padding: 18px 18px 20px;
        overflow: hidden;
      }
      .cphead .cpimg {
        position: absolute;
        right: -20px;

      .cphead > span {

      .cpoff {

        font-weight: 800;
        line-height: 1;
        margin-top: 6px;
      }
      .cpname {
        font-size: 18px;
        font-weight: 600;
      }
      .cpcut {
        position: relative;
        border-top: 2px dashed #e4e4e4;
      }
      .cpcut::before,
      .cpcut::after {
        content: "";
        position: absolute;
        top: -13px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #6d5f55;
      }
      .cpcut::before {
        left: -12px;
      }
      .cpcut::after {
        right: -12px;
      }
      .cpbody {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 16px 18px 18px;
      }
      .cpbody .dprice {
        margin-top: 0;
        justify-content: space-between;
      }
      .cpbody .dprice b {
        color: #e5484d;
      }
      .cd {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .cd span {
        flex: 1;
        text-align: center;
        background: #fdecec;
        border-radius: 12px;
        padding: 6px 0;
        font-size: 12px;

      .cd b {

        font-weight: 700;

      }
      .cpbody .dcta {
        background: #e5484d;
        color: #fff;
      }
      .dhint {
        margin: 8px 0 0;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
      }
      .dnav {
        display: flex;
        gap: 6px;
      }
      .ddot {
        width: 7px;
        height: 7px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.5);
        cursor: pointer;
      }
      .ddot.on {
        width: 20px;
        background: #fff;
      }
      .dswipe {
        margin: -4px 0 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
      }
      .dswipe span {
        font-size: 18px;
        line-height: 1;
        animation: nudge 1.4s ease-in-out infinite;
      }
      .dswipe span:first-child {
        animation-direction: reverse;
      }
      @keyframes nudge {
        50% {
          transform: translateX(3px);
        }
      }
      .darrow {
        position: absolute;
        z-index: 5;
        top: 50%;
        width: 42px;
        height: 42px;
        margin-top: -21px;
        border: 0;
        border-radius: 50%;
        background: #fff;
        color: var(--ink);
        display: grid;
        place-items: center;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      }
      .darrow.prev {
        left: -14px;
      }
      .darrow.next {
        right: -14px;
      }
      .darrow.next svg {
        transform: scaleX(-1);
      }
      /* Günün önerisi: alttan açılan sayfa */
      /* Günün önerisi ekranın ortasında açılır */
      .ov.bsov {
        align-items: center;
        padding: 16px;
      }
      .bsheet {
        position: relative;
        width: min(340px, 100%);
        max-height: calc(100vh - 32px);
        display: flex;
        flex-direction: column;
        background: #fff;

        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);

        to {

          opacity: 1;

        position: relative;
        flex: none;
      }
      .bsimg {
        display: block;

        height: 170px;
        object-fit: cover;

      .bsimg.ph {

      .bsx {

        gap: 12px;

        font-size: 14px;

      }
      .bschips b {

        font-size: 19px;
        font-weight: 700;
        color: var(--ink);
      }
      .bswhy {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 12px;
        background: var(--accent-soft);
        color: var(--accent-ink);

      }
      .bswhy b {

        text-transform: uppercase;

      }

        margin: 12px 0 6px;
        font-size: 14px;
        font-weight: 700;
      }
      .bsheet .sizes {
        margin: 0;
      }
      .bsgoes {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 6px;
        scrollbar-width: none;
      }
      .bsgoes::-webkit-scrollbar {
        display: none;
      }
      .bsg {
        position: relative;
        flex: none;
        width: 92px;
        font-size: 12px;
      }
      .bsg b {
        display: block;
        margin-top: 6px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bsg small {
        color: var(--muted);
      }
      .bsgimg {
        display: block;
        width: 92px;
        height: 68px;
        border-radius: 14px;
        object-fit: cover;
      }
      .bsgimg.ph {
        display: grid;
        place-items: center;
        font-size: 22px;
      }
      .bsgadd {
        position: absolute;
        right: 6px;
        top: 40px;
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 50%;
        background: #fff;
        color: var(--accent);
        display: grid;

      const T = (k) => (UI[S.lang][k] ?? UI.tr[k]).replace("{t}", TABLE);
      const pn = (p) => (PT[S.lang] && PT[S.lang][p.id] ? PT[S.lang][p.id][0] : p.n);
      const pd = (p) => (PT[S.lang] && PT[S.lang][p.id] ? PT[S.lang][p.id][1] : p.d);
      const cn = (c) => (CT[S.lang] && CT[S.lang][c.id] ? CT[S.lang][c.id][0] : c.n);

      const starPts = (cx, cy, R, r) =>
        Array.from({ length: 10 }, (_, i) => {
          const a = Math.PI + (i * Math.PI) / 5,
            q = i % 2 ? r : R;
          return (cx + q * Math.cos(a)).toFixed(2) + "," + (cy + q * Math.sin(a)).toFixed(2);
        }).join(" ");
      const FLAGS = {
        tr: `<rect width="30" height="20" fill="#E30A17"/><circle cx="12.8" cy="10" r="5" fill="#fff"/><circle cx="14.2" cy="10" r="4" fill="#E30A17"/><polygon fill="#fff" points="${starPts(19.2, 10, 2.5, 1)}"/>`,
        en: `<rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#C8102E" stroke-width="1.6"/><path d="M15 0V20M0 10H30" stroke="#fff" stroke-width="6"/><path d="M15 0V20M0 10H30" stroke="#C8102E" stroke-width="3.4"/>`,
        de: `<rect width="30" height="6.67" fill="#000"/><rect y="6.67" width="30" height="6.67" fill="#DD0000"/><rect y="13.33" width="30" height="6.67" fill="#FFCE00"/>`,
        ru: `<rect width="30" height="6.67" fill="#fff"/><rect y="6.67" width="30" height="6.67" fill="#0039A6"/><rect y="13.33" width="30" height="6.67" fill="#D52B1E"/>`,
      };
      const flag = (id) =>
        `<span class="flag"><svg viewBox="0 0 30 20" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${FLAGS[id]}</svg></span>`;

      const savedLang = (() => {
        try {
          return localStorage.getItem("lang");
        } catch (err) {
          return null;
        }
      })();
      const wantLang = QP.get("dil") || savedLang;
      S.lang = LANGS.some((l) => l.id === wantLang) ? wantLang : "tr";
      document.documentElement.lang = S.lang;

      function img(src, alt, cls) {
        return `<img class="${cls}" src="${src}" alt="${alt}" loading="lazy" onerror="ph(this)">`;
      }
      function ph(el) {
        let h = 0;
        for (const ch of el.alt) h = (h * 31 + ch.charCodeAt(0)) % 360;
        const d = document.createElement("div");
        d.className = el.className + " ph";
        d.textContent = el.alt.charAt(0).toLocaleUpperCase(document.documentElement.lang || "tr");
        d.style.background = `hsl(${h},60%,90%)`;
        d.style.color = `hsl(${h},45%,32%)`;
        el.replaceWith(d);
      }

      function cartBtn() {
        const n = count();
        return `<button class="ibtn" data-act="go" data-v="cart" aria-label="${T("cart")}">${I.bag}${n ? `<span class="badge">${n}</span>` : ""}</button>`;
      }
      function langUI() {
        const cur = LANGS.find((l) => l.id === S.lang);
        return `<div class="lang">
    <button class="ibtn lbtn" data-act="lang" aria-label="${T("lang")}" aria-haspopup="true" aria-expanded="${S.lm}">${flag(cur.id)}</button>
    ${S.lm ? `<div class="lmenu" role="menu">${LANGS.map((l) => `<button class="lopt${l.id === S.lang ? " on" : ""}" role="menuitem" data-act="setlang" data-l="${l.id}">${flag(l.id)}<span>${l.n}</span></button>`).join("")}</div>` : ""}
  </div>`;
      }
      const tools = () => `<div class="tools">${langUI()}</div>`;
      function topBack(title) {
        return `<div class="top"><button class="ibtn" data-act="go" data-v="home" aria-label="${T("back")}">${I.back}</button><div class="grow"><h1>${title}</h1></div>${tools()}</div>`;
      }

      // Boyutlu ürünlerde + önce boyut seçtirir (detay penceresi); sepette her boyut ayrı satırdır.
      function row(p, key) {
        const pick = !key && sized(p);
        const size = key ? split(key).size : null;
        const q = key ? cart[key] || 0 : pick ? Object.keys(cart).reduce((s, k) => s + (split(k).id === p.id ? cart[k] : 0), 0) : cart[p.id] || 0;
        const k = key || p.id;
        return `<div class="row" data-act="detail" data-id="${p.id}">
    ${img(pimg(p), pn(p), "rimg")}
    <div class="rinfo"><b>${pn(p)}${size ? ` · ${T("s" + size)}` : ""}</b>${key && notes[key] ? `<small class="rnote">${T("note")}: ${esc(notes[key])}</small>` : `<small>${pd(p)}</small>`}
      <div class="meta"><span class="star">${I.star}${p.r.toFixed(1)}</span><span>${oldTag(p)}${TL(priceOf(p, size))}</span></div>
    </div>
    <div class="qty">
      ${q && !pick ? `<button class="qb" data-act="sub" data-id="${k}" aria-label="${T("dec")}">${I.minus}</button>` : ""}${q ? `<span class="n">${q}</span>` : ""}
      <button class="qb add" data-act="${pick ? "detail" : "add"}" data-id="${k}" aria-label="${T("inc")}">${I.plus}</button>
    </div>
  </div>`;
      }

      /* Fırsatlar şeridi sırası: kampanya, combo, saate uygun kategori, sepete göre "yanına",
   sonra işletmenin seçtiği hikâye ürünleri. */
      function offers() {
        const out = [];
        for (const id in DEALS) {
          const p = PRODUCTS.find((x) => x.id === id);
          if (p) out.push({ k: "deal", p, off: DEALS[id] });
        }
        combos().forEach((c) => out.push({ k: "combo", p: c }));
        const now = catsOrdered().find((c) => fits(c.id));
        if (now) out.push({ k: "now", cat: now });
        const pair = pairPick();
        if (pair) out.push({ k: "pair", p: pair.p, after: pair.after });
        const shown = new Set(out.map((o) => o.p?.id));
        CONFIG.stories
          .map((id) => PRODUCTS.find((p) => p.id === id))
          .filter((p) => p && !shown.has(p.id))
          .forEach((p) => out.push({ k: "story", p }));
        return out.slice(0, 10);
      }
      // Sepete son eklenen ürünün yanına giden kategoriden, sepette olmayan en beğenilen ürün.
      function pairPick() {
        const after = Object.keys(cart).map((k) => byId(split(k).id)).filter((p) => p && PAIRS[p.c]).pop();
        if (!after) return null;
        const p = PRODUCTS.filter((x) => x.c === PAIRS[after.c] && !inCart(x.id)).sort((a, b) => b.r - a.r)[0];
        return p ? { p, after } : null;
      }
      const OFFER_BG = { deal: "#e5484d", combo: "#2e1b17", now: "var(--accent)", pair: "#0f6e56", story: "#1f1f1f" };
      const clock = () => String(new Date().getHours()).padStart(2, "0") + ":" + String(new Date().getMinutes()).padStart(2, "0");
      const catItems = (cat) => PRODUCTS.filter((p) => p.c === cat.id);

      // Şeritteki afiş kartı
      function tile(o, i) {
        const bg = `style="background:${OFFER_BG[o.k]}"`;
        const open = `data-act="offer" data-i="${i}"`;
        if (o.k === "deal")
          return `<button class="tile" ${bg} ${open}>${img(pimg(o.p), pn(o.p), "timg")}<span class="tt">${pn(o.p)}</span><span><span class="tb" style="font-size:34px">%${o.off}</span><span class="ts">${T("today")}</span></span></button>`;
        if (o.k === "combo")
          return `<button class="tile" ${bg} ${open}>${img(pimg(o.p), pn(o.p), "timg")}<span class="tt">${o.p.items.map(pn).join(" + ")}</span><span><span class="ts"><s>${TL(o.p.was)}</s></span><span class="tb" style="font-size:25px;color:#f5c542">${TL(o.p.p)}</span></span></button>`;
        if (o.k === "now")
          return `<button class="tile" ${bg} ${open}>${img(o.cat.img || "images/" + o.cat.id + ".jpg", cn(o.cat), "timg")}<span class="tt">${clock()}</span><span><span class="tb" style="font-size:18px">${T("cattime").replace("{c}", cn(o.cat))}</span><span class="ts">${catItems(o.cat).length} ${T("kinds")}</span></span></button>`;
        if (o.k === "pair")
          return `<button class="tile" ${bg} ${open}>${img(pimg(o.p), pn(o.p), "timg")}<span class="tt">${T("pair")}</span><span><span class="tb" style="font-size:16px">${pn(o.p)}</span><span class="ts">${TL(priceOf(o.p))}</span></span></button>`;
        return `<button class="tile photo" ${bg} ${open}>${img(pimg(o.p), pn(o.p), "timg")}<span></span><span><span class="tb" style="font-size:14px;font-weight:600">${pn(o.p)}</span><span class="ts">${TL(priceOf(o.p))}</span></span></button>`;
      }

      // Kuponun geri sayımı: gün sonuna kalan süre
      function countdown() {
        const end = new Date();
        end.setHours(23, 59, 59, 999);
        const s = Math.max(0, Math.floor((end - Date.now()) / 1000));
        const two = (v) => String(v).padStart(2, "0");
        return `<span><b>${two(Math.floor(s / 3600))}</b>${T("hh")}</span><span><b>${two(Math.floor((s % 3600) / 60))}</b>${T("mm")}</span><span><b>${two(s % 60)}</b>${T("ss")}</span>`;
      }

      // Destedeki kart: türüne göre kendi düzeni
      function offerCard(o) {
        if (o.k === "deal")
          return `<div class="dcard cp front">
      <div class="cphead">${img(pimg(o.p), pn(o.p), "cpimg")}<span class="dk">${esc(BRAND.name)} · ${T("coupon")}</span><span class="cpoff">%${o.off}</span><span class="cpname">${pn(o.p)}</span></div>
      <div class="cpcut"></div>
      <div class="cpbody">
        <div class="dprice"><s>${TL(o.p.p)}</s><b>${TL(priceOf(o.p))}</b></div>
        <div class="cd" data-cd>${countdown()}</div>
        <button class="dcta" data-act="offeradd" data-id="${o.p.id}">${T("usecp")}</button>
        <p class="dhint">${T("cpnote")}</p>
      </div>
    </div>`;
        if (o.k === "combo")
          return `<div class="dcard front" style="background:${OFFER_BG.combo}">
      <p class="dk" style="color:#f5c542">${T("combok")}</p>
      <div class="cpair">${o.p.items.map((p) => img(pimg(p), pn(p), "cthumb")).join("<span>+</span>")}</div>
      <h3 style="text-align:center">${o.p.items.map(pn).join(" + ")}</h3>
      <div class="dprice" style="justify-content:center"><s>${TL(o.p.was)}</s><b style="color:#f5c542">${TL(o.p.p)}</b></div>
      <span class="dsave" style="align-self:center">${T("save").replace("{n}", TL(o.p.was - o.p.p))}</span>
      <button class="dcta" style="background:#f5c542;color:#2e1b17" data-act="offeradd" data-id="${o.p.id}">${T("both")}</button>
    </div>`;
        if (o.k === "now")
          return `<div class="dcard front" style="background:${OFFER_BG.now}">
      <p class="dk">${clock()}</p>
      <h3>${T("cattime").replace("{c}", cn(o.cat))}</h3>
      <div class="dlist">${catItems(o.cat)
        .slice()
        .sort((a, b) => b.r - a.r)
        .slice(0, 3)
        .map(
          (p) =>
            `<div class="dli">${img(pimg(p), pn(p), "dlimg")}<div class="grow"><b>${pn(p)}</b><small>${TL(priceOf(p))}</small></div><button class="dadd" data-act="offeradd" data-id="${p.id}" aria-label="${T("inc")}">${I.plus}</button></div>`,
        )
        .join("")}</div>
      <button class="dcta" data-act="go" data-v="list" data-c="${o.cat.id}">${T("seeall")}</button>
    </div>`;
        const cat = CATS.find((c) => c.id === o.p.c);
        return `<div class="dcard front" style="background:${OFFER_BG[o.k]}">
      <p class="dk">${o.k === "pair" ? T("pairt").replace("{p}", pn(o.after)) : cat ? cn(cat) : ""}</p>
      ${img(pimg(o.p), pn(o.p), "dimg")}
      <h3>${pn(o.p)}</h3>
      <p class="dd">${pd(o.p)}</p>
      <div class="dprice"><b>${TL(priceOf(o.p))}</b></div>
      <button class="dcta" data-act="offeradd" data-id="${o.p.id}">${T("add")}</button>
    </div>`;
      }

      function deckPopup() {
        if (S.deck === null) return "";
        const list = offers();
        if (!list.length) return "";
        const i = Math.min(S.deck, list.length - 1);
        const behind = [list[i + 2], list[i + 1]]
          .map((o, n) => (o ? `<div class="dcard b${2 - n}" style="background:${OFFER_BG[o.k]}"></div>` : ""))
          .join("");
        return `<div class="ov deckov" data-act="deckclose">
    <div class="deck" role="dialog" aria-modal="true" aria-label="${T("offers")}">${behind}${offerCard(list[i])}${i > 0 ? `<button class="darrow prev" data-act="deckprev" aria-label="${T("back")}">${I.back}</button>` : ""}${i < list.length - 1 ? `<button class="darrow next" data-act="decknext" aria-label="${T("offers")}">${I.back}</button>` : ""}</div>
    <div class="dnav">${list.map((_, n) => `<button class="ddot${n === i ? " on" : ""}" data-act="deckgo" data-i="${n}" aria-label="${n + 1}"></button>`).join("")}</div>
    ${list.length > 1 ? `<p class="dswipe"><span aria-hidden="true">‹</span>${T("swipe")}<span aria-hidden="true">›</span></p>` : ""}
    <button class="dclose" data-act="deckclose" aria-label="${T("close")}">${I.close}</button>
  </div>`;
      }
      // Günün önerisi: alttan açılan uygulama sayfası. Adet ve boyut değişince sayfa yeniden çizilmez.
      function dailyPopup() {
        const p = S.daily ? byId(S.daily) : null;
        if (!p) return "";
        const cat = CATS.find((c) => c.id === p.c);
        const about = DETAIL[p.id] ? (S.lang === "tr" ? DETAIL[p.id][0] : DETAIL[p.id][1]) : pd(p);
        const sizes = sized(p)
          ? `<p class="bsh">${T("size")}</p><div class="sizes" role="radiogroup" aria-label="${T("size")}">${SIZES.map(
              (s) =>
                `<button class="size${s.k === S.sz ? " on" : ""}" role="radio" aria-checked="${s.k === S.sz}" data-act="size" data-s="${s.k}">${T("s" + s.k)}<small>${TL(priceOf(p, s.k))}</small></button>`,
            ).join("")}</div>`
          : "";
        const goes = PRODUCTS.filter((x) => x.c === PAIRS[p.c] && x.id !== p.id)
          .sort((a, b) => b.r - a.r)
          .slice(0, 4);
        return `<div class="ov bsov" data-act="dailyclose">
    <div class="bsheet" role="dialog" aria-modal="true" aria-labelledby="dly">
      <div class="bshero">

      function render() {
        const view = { home: viewHome, list: viewList, cart: viewCart, done: viewDone }[S.v]();
        const n = count();
        const cartFab =
          S.v === "home" || S.v === "list"
            ? `<button class="cartfab" data-act="go" data-v="cart" aria-label="${T("cart")}" title="${T("cart")}">${I.bag}${n ? `<span class="badge">${n}</span>` : ""}</button>`
            : "";
        const waiter = `<button class="waiter" data-act="waiterask" aria-label="${T("waiter")}" title="${T("waiter")}">${I.bell}</button>`;
        const toast = S.toast
          ? `<div class="toast" role="status"><svg class="tick" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>${S.toast}</div>`
          : "";
        const app = document.getElementById("app");
        // Panelde kapatılan özellikler (Menü Ayarları / Canlı Servis) gizlenir.
        app.className = ["v-" + S.v, SET.cart ? "" : "nocart", SET.ratings ? "" : "noratings", SET.stories ? "" : "nostories", SET.daily ? "" : "nodaily"].join(" ");
        app.innerHTML = `<div class="zm">${view}</div>` + (SET.cart ? cartFab : "") + (SET.waiter ? waiter : "") + toast + popup() + detailPopup() + waiterPopup() + deckPopup() + dailyPopup();
        clearInterval(cdTimer);
        if (app.querySelector("[data-cd]")) cdTimer = setInterval(() => app.querySelectorAll("[data-cd]").forEach((el) => (el.innerHTML = countdown())), 1000);
        const open = S.pop || S.sp || S.wc || S.dt || S.daily || S.deck !== null;
        document.body.style.overflow = open ? "hidden" : "";
        if (open) app.querySelector(".sheet .cta, .sheet button")?.focus();
      }

      let cdTimer;
      function keep(fn) {
        const y = window.scrollY;
        fn();
        window.scrollTo(0, y);
      }

      let toastTimer;
      function showToast(msg) {
        S.toast = msg;
        keep(render);
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          S.toast = "";
          keep(render);
        }, 3500);
      }

      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-act]");
        if (S.lm && !e.target.closest(".lang")) {
          S.lm = false;
          if (!t) {
            keep(render);
            return;
          }
        }
        if (!t) return;
        const a = t.dataset.act,
          id = t.dataset.id;
        if (t.classList.contains("ov") && e.target.closest(".sheet, .deck, .dnav, .bsheet")) return;
        if (a === "popclose") {
          S.pop = false;
          S.sp = null;
          keep(render);
          return;
        }
        if (a === "story") {
          S.sp = id;
          S.seen[id] = 1;
          keep(render);
          return;
        }
        if (a === "lang") {
          S.lm = !S.lm;
          keep(render);
          return;
        }
        if (a === "setlang") {
          S.lang = t.dataset.l;
          S.lm = false;
          try {
            localStorage.setItem("lang", S.lang);
          } catch (err) {}
          document.documentElement.lang = S.lang;
          keep(render);
          return;
        }
        if (a === "detail") {
          S.dt = id;
          S.sz = "o";
          S.note = "";
          keep(render);
          return;
        }
        if (a === "size") {
          // Pencere yeniden çizilmez (titremesin): yalnızca seçili düğme ve fiyat değişir.
          S.sz = t.dataset.s;
          const box = t.closest(".sheet, .dcard, .bsheet");
          box.querySelectorAll(".size").forEach((b) => {
            const on = b.dataset.s === S.sz;
            b.classList.toggle("on", on);
            b.setAttribute("aria-checked", String(on));
          });
          const p = byId(S.daily || S.dt);
          box.querySelectorAll(".js-price").forEach((el) => (el.innerHTML = oldTag(p) + TL(priceOf(p, S.sz))));
          if (S.daily) refreshDaily(box);
          return;
        }
        if (a === "deckprev" || a === "decknext") {
          deckGo(a === "decknext" ? 1 : -1);
          return;
        }
        if (a === "daily") {
          S.daily = id;
          S.sz = "o";
          S.dq = 1;
          keep(render);
          return;
        }
        if (a === "dq") {
          S.dq = Math.min(Math.max(S.dq + Number(t.dataset.d), 1), 20);
          refreshDaily(t.closest(".bsheet"));
          return;
        }
        if (a === "goesadd") {
          // "Yanına iyi gider" ürünü sepete girer; sayfa açık kalır, düğme onay işaretine döner.
          const k = keyOf(id, sized(byId(id)) ? "o" : null);
          cart[k] = (cart[k] || 0) + 1;
          save();
          t.classList.add("done");
          t.innerHTML = "✓";
          return;
        }
        if (a === "dailyclose") {
          S.daily = null;
          keep(render);
          return;
        }
        if (a === "dailyadd") {
          const k = keyOf(id, sized(byId(id)) ? S.sz : null);
          cart[k] = (cart[k] || 0) + S.dq;
          save();
          S.daily = null;
          showToast(`<b>${pn(byId(id))}</b>${T("added")}`);
          return;
        }
        if (a === "offer") {
          S.deck = Number(t.dataset.i);
          keep(render);
          return;
        }
        if (a === "deckgo") {
          S.deck = Number(t.dataset.i);
          keep(render);
          return;
        }
        if (a === "deckclose") {
          S.deck = null;
          keep(render);
          return;
        }
        if (a === "offeradd") {
          // Fırsat sepete girer (içecekler orta boy), sonra sıradaki karta geçilir.
          const k = keyOf(id, sized(byId(id)) ? "o" : null);
          cart[k] = (cart[k] || 0) + 1;
          save();
          showToast(`<b>${pn(byId(id))}</b>${T("added")}`);
          deckGo(1);
          return;
        }
        if (a === "dtclose") {
          S.dt = null;
          keep(render);
          return;
        }
        if (a === "waiterask") {
          S.wc = true;
          keep(render);
          return;
        }
        if (a === "waitclose") {
          S.wc = false;
          keep(render);
          return;
        }
        if (a === "waiter") {
          S.wc = false;
          if (Date.now() < S.waitUntil) {
            showToast(T("waitwait"));
            return;
          }
          callWaiter()
            .then(() => {
              S.waitUntil = Date.now() + SET.cooldown * 1000;
              showToast(T("waitok"));
            })
            .catch(() => showToast(T("senderr")));
          return;
        }
        if (a === "order") {
          // The cart is emptied only once the order has reached the server.
          const lines = Object.entries(cart).map(([key, qty]) => {
            const { id: pid, size } = split(key);
            const p = byId(pid);
            // Fiyatı sunucu menüden hesaplar; ad ve fiyat yalnızca sunucusuz demo içindir.
            return { id: pid, size, name: size ? `${p.n} (${UI.tr["s" + size]})` : p.n, qty, price: priceOf(p, size) };
          });
          // Ürün notları siparişin notu olur: garson ekranında ve Canlı Servis'te görünür.
          const note = Object.entries(notes)
            .filter(([k]) => cart[k])
            .map(([k, n]) => {
              const { id: pid, size } = split(k);
              return `${size ? ` (${UI.tr["s" + size]})` : ""}: ${n}`;
            })
            .join(" · ");
          t.disabled = true;
          sendOrder(lines, note)
            .then(() => {
              cart = {};
              notes = {};
              S.v = "home";
              save();
              render();
              window.scrollTo(0, 0);
              showToast(`<b>${T("done")}</b>${T("doned")}`);
            })
            .catch(() => {
              t.disabled = false;
              showToast(T("senderr"));
            });
          return;
        }
        if (a === "go") {
          S.deck = null;
          S.v = t.dataset.v;
          if (t.dataset.c) S.c = t.dataset.c;
          render();
          window.scrollTo(0, 0);
          return;
        }
        const y = window.scrollY;
        if (a === "add") cart[id] = (cart[id] || 0) + 1;
        if (a === "dtadd") {
          const k = keyOf(id, sized(byId(id)) ? S.sz : null);
          cart[k] = (cart[k] || 0) + 1;
          const note = S.note.trim().slice(0, 80);
          if (note && notes[k] !== note) notes[k] = notes[k] ? `${notes[k]} / ${note}` : note;
          S.dt = null;
        }
        if (a === "popadd") {
          const k = keyOf(id, sized(byId(id)) ? "o" : null);
          cart[k] = (cart[k] || 0) + 1;
          S.pop = false;
          S.sp = null;
        }
        if (a === "sub") {
          cart[id] = (cart[id] || 0) - 1;
          if (cart[id] <= 0) delete cart[id];
        }
        save();
        render();
        window.scrollTo(0, y);
      });

      // Not, pencere yeniden çizilince (boyut seçimi) kaybolmasın.
      document.addEventListener("input", (e) => {
        if (e.target.id === "pnote") S.note = e.target.value;
      });

      // Destede kart parmakla yana atılır: sola sonraki, sağa önceki.
      let drag = null;
      document.addEventListener("pointerdown", (e) => {
        const el = e.target.closest(".dcard.front");
        if (!el || e.target.closest("button")) return;
        drag = { el, x: e.clientX, dx: 0 };
        el.setPointerCapture(e.pointerId);
      });
      document.addEventListener("pointermove", (e) => {
        if (!drag) return;
        drag.dx = e.clientX - drag.x;
        drag.el.style.transform = `translateX(${drag.dx}px) rotate(${drag.dx / 18}deg)`;
      });
      document.addEventListener("pointerup", () => {
        if (!drag) return;
        const { el, dx } = drag;
        drag = null;
        if (Math.abs(dx) < 70) {
          el.style.transform = "";
          return;
        }
        el.classList.add("fly");
        el.style.transform = `translateX(${dx < 0 ? -420 : 420}px) rotate(${dx < 0 ? -20 : 20}deg)`;
        setTimeout(() => deckGo(dx < 0 ? 1 : -1), 180);
      });

      document.addEventListener("keydown", (e) => {
        if (S.deck !== null && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
          deckGo(e.key === "ArrowRight" ? 1 : -1);
          return;
        }
        if (e.key !== "Escape") return;
        if (S.deck !== null || S.daily) {
          S.deck = null;
          S.daily = null;
          keep(render);
        } else if (S.wc) {
          S.wc = false;
          keep(render);
        } else if (S.dt) {
          S.dt = null;
          keep(render);
        } else if (S.pop || S.sp) {
          S.pop = false;
          S.sp = null;
          keep(render);
        } else if (S.lm) {
          S.lm = false;
          keep(render);
        }
      });

      /* İki ayrı içerik:
   Öne çıkan lezzet = işletmenin bugün satmak istediği ürün (açılış penceresi)
   Günün önerisi    = algoritmanın seçtiği farklı bir ürün (ana ekrandaki kart) */
      function spotlight(skipCart) {
        const pool = PRODUCTS.filter((p) => CONFIG.focus.includes(p.id));
        return (pool.length ? pool : PRODUCTS)
          .slice()
          .sort((a, b) => score(b) - score(a))
          .find((p) => !(skipCart && inCart(p.id)));
      }
      /* Menü işletme panelinden gelir (Menü sayfası). Sunucuya ulaşılamazsa
   bu dosyadaki menü gösterilir. */
      function applyMenu(m) {
        const products = (m.products || []).filter((p) => p.active !== false);
        if (!m.categories?.length || !products.length) return;
        if (m.brand?.name) BRAND.name = m.brand.name;
        CATS.splice(0, CATS.length, ...m.categories.map((c) => ({ id: c.id, n: c.name, s: c.subtitle || "" })));
        PRODUCTS.splice(
          0,
          PRODUCTS.length,
          ...products
            .filter((p) => CATS.some((c) => c.id === p.category))
            .map((p) => ({ id: p.id, c: p.category, n: p.name, d: p.description || "", p: Number(p.price) || 0, r: Number(p.rating) || 0, img: upImg(p.image) })),
        );
        CATS.forEach((c) => (c.img = upImg(m.categories.find((x) => x.id === c.id)?.image)));
        for (const lang of ["en", "de", "ru"]) {
          CT[lang] = CT[lang] || {};
          PT[lang] = PT[lang] || {};
          m.categories.forEach((c) => {
            const t = c.i18n?.[lang];
            if (t?.name) CT[lang][c.id] = [t.name, t.subtitle || ""];
            else delete CT[lang][c.id];
          });
          products.forEach((p) => {
            const t = p.i18n?.[lang];
            if (t?.name) PT[lang][p.id] = [t.name, t.description || ""];
            else delete PT[lang][p.id];
          });
        }
        products.forEach((p) => {
          if (p.detail?.tr) DETAIL[p.id] = [p.detail.tr, p.detail.en || p.detail.tr, (p.ingredients || []).join(" ")];
        });
        // Silinen ürünler sepetten, öne çıkanlardan ve hikayelerden düşer.
        const has = (id) => PRODUCTS.some((p) => p.id === id);
        Object.keys(cart).forEach((k) => byId(split(k).id) || delete cart[k]);
        CONFIG.focus = CONFIG.focus.filter(has);
        CONFIG.stories = CONFIG.stories.filter(has);
        S.c = CATS[0].id;
        document.title = BRAND.name;
      }

      // Panelde yüklenen fotoğraflar sunucudan (3000 portu) gelir; diğerleri images/<kod>.jpg
      const API_ORIGIN = SERVER;
      const upImg = (src) => (src && src.startsWith("/api/") ? API_ORIGIN + src : "");
      const pimg = (p) => p.img || "images/" + p.id + ".jpg";

      // Menü Ayarları, Story ve Ana Sayfa kartlarındaki seçimler
      function applySettings(settings, story, picks, profile) {
        if (profile) {
          BRAND.name = profile.name || BRAND.name;
          BRAND.logo = upImg(profile.logo);
          document.title = BRAND.name;
          if (profile.status === "suspended") S.closed = true;
        }
        if (settings) {
          SET.waiter = settings.features?.waiter !== false;
          SET.cart = settings.features?.cart !== false;
          SET.ratings = settings.ratings !== false;
          SET.stories = settings.stories !== false;
          SET.cooldown = Number(settings.waiterCooldown) || 60;
          if (/^#[0-9a-f]{6}$/i.test(settings.accent || "")) document.documentElement.style.setProperty("--accent", settings.accent);
          const on = (settings.languages || []).filter((l) => l.on).map((l) => l.id);
          if (on.length) {
            LANGS.splice(0, LANGS.length, ...LANGS.filter((l) => on.includes(l.id)));
            const want = QP.get("dil") || savedLang || settings.defaultLang;
            S.lang = on.includes(want) ? want : on.includes(settings.defaultLang) ? settings.defaultLang : on[0];
            document.documentElement.lang = S.lang;
          }
        }
        const has = (id) => PRODUCTS.some((p) => p.id === id);
        if (story?.ids?.length) CONFIG.stories = story.ids.filter(has);
        if (picks) {
          if (picks.featured) {
            CONFIG.popup = picks.featured.shown !== false;
            if (has(picks.featured.resolved)) CONFIG.focus = [picks.featured.resolved];
          }
          if (picks.daily) {
            SET.daily = picks.daily.shown !== false;
            if (has(picks.daily.resolved)) S.dailyId = picks.daily.resolved;
          }
        }
      }

      let SPOT, FEAT, POP;
      function start() {
        if (S.closed) {
          document.getElementById("app").innerHTML = `<div class="empty" style="padding-top:120px"><p>${BRAND.name}</p>Menü şu an kullanılamıyor.</div>`;
          return;
        }
        SPOT = spotlight(false);
        FEAT = (S.dailyId && byId(S.dailyId)) || ranked().find((p) => p.id !== SPOT?.id && !CONFIG.focus.includes(p.id));
        POP = CONFIG.popup && QP.get("popup") !== "0" ? spotlight(true) || null : null;
        S.pop = !!POP;
        render();
      }
      // Menü ve ayarlar birlikte gelir; sunucuya 3 saniyede ulaşılamazsa bu dosyadaki menü açılır.
      const menuWait = new AbortController();
      setTimeout(() => menuWait.abort(), 3000);
      const getJson = (path) =>
        fetch(API + path, { cache: "no-store", signal: menuWait.signal })
          .then((r) => (r.ok ? r.json() : null))
          .catch(() => null);
      Promise.all([getJson("/menu"), getJson("/docs/settings"), getJson("/docs/story"), getJson("/docs/picks"), getJson("/profile")])
        .then(([m, settings, story, picks, profile]) => {
          if (m) applyMenu(m);
          applySettings(settings, story, picks, profile);
        })
        .catch(() => {})
        .finally(() => {
          start();
          splash();
        });

      /* Açılış ekranı: işletmenin logosu ve adı, sonra perde yukarı kalkar.
   Dokununca hemen geçer; aynı tarayıcıda 10 dakika içinde tekrar açılırsa gösterilmez. */
      function splash() {
        const el = document.getElementById("splash");
        const key = "splash-" + BUSINESS;
        let seen = 0;
        try {
          seen = Number(sessionStorage.getItem(key)) || 0;
          sessionStorage.setItem(key, String(Date.now()));
        } catch (e) {}
        const lift = () => {
          if (!el.isConnected || el.classList.contains("go")) return;
          el.classList.add("go");
          setTimeout(() => el.remove(), 600);
        };
        if (S.closed || Date.now() - seen < 10 * 60 * 1000) {
          el.remove();
          return;
        }
        el.innerHTML = `${img(BRAND.logo || "images/logo.png", BRAND.name, "")}<b>${esc(BRAND.name)}</b>`;
        el.classList.add("in");
        el.addEventListener("click", lift);
        setTimeout(lift, 1700);
      }
    </script>
  </body>
</html>
